[package]
name = "pouw-node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "pouw-node.rs"

[[bin]]
name = "pouw-node"
path = "pouw-node-main.rs"

[features]
default = ["rocksdb", "store-mem", "groth16"]
groth16 = ["pouw-provers/groth16"]
rocksdb = []
store-mem = []

[dependencies]
borsh.workspace = true
pouw-api.workspace = true
pouw-consensus.workspace = true
pouw-crypto.workspace = true
pouw-provers.workspace = true
pouw-types.workspace = true
serde.workspace = true
signal-hook.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zerocopy.workspace = true

[dev-dependencies]
pouw-node = { path = ".", features = ["store-mem"] }
serde_json.workspace = true
