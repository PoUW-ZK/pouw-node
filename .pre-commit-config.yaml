# Local checks before every commit: generic file hygiene, gitleaks, and the Rust
# checks (rustfmt, cargo check, clippy) over the whole workspace.
#   pipx install pre-commit   (or the distro package)
#   pre-commit install
# Updating versions: pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: \.jsonc$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
        files: (\.rs|Cargo\.toml|Cargo\.lock|rustfmt\.toml)$
      - id: cargo-check
        name: cargo check
        entry: cargo check --workspace --all-targets --all-features
        language: system
        pass_filenames: false
        files: (\.rs|Cargo\.toml|Cargo\.lock)$
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        files: (\.rs|Cargo\.toml|Cargo\.lock)$
