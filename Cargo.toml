[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
arithmetic_side_effects = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[workspace.dependencies]
base64 = "0.22.1"
borsh = { version = "1.5.7", features = ["derive"] }
clap = { version = "4.5.48", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
foldhash = { version = "0.2.0", default-features = false }
hex = "0.4.3"
proptest = "1.8.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
ruint = { version = "1.21.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
signal-hook = "0.4.5"
sha2 = "0.10.9"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.53.2", default-features = false, features = ["rt", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
zerocopy = { version = "0.8.63", features = ["derive"] }

pouw-api = { path = "crates/pouw-api" }
pouw-consensus = { path = "crates/pouw-consensus" }
pouw-crypto = { path = "crates/pouw-crypto" }
pouw-light-client = { path = "crates/pouw-light-client" }
pouw-provers = { path = "crates/pouw-provers", default-features = false }
pouw-types = { path = "crates/pouw-types" }
