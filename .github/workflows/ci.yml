name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect project
        id: detect
        run: |
          if [ -f Cargo.toml ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cargo.toml does not exist yet, checks will be skipped."
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.detect.outputs.rust == 'true'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.detect.outputs.rust == 'true'

      - name: Format
        if: steps.detect.outputs.rust == 'true'
        run: cargo fmt --all --check

      - name: Clippy
        if: steps.detect.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        if: steps.detect.outputs.rust == 'true'
        run: cargo test --workspace --all-features --locked

      - name: Docs
        if: steps.detect.outputs.rust == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

      - name: Light client stays independent
        if: steps.detect.outputs.rust == 'true'
        run: |
          cargo build --locked -p pouw-light-client
          if cargo tree --locked -p pouw-light-client -e normal --prefix none --format '{lib}' | grep -E '^pouw_(node|prover|consensus)'; then
            echo "::error::pouw-light-client depends on the node, consensus or a prover crate"
            exit 1
          fi

      - name: Licenses and vulnerabilities (cargo-deny)
        if: steps.detect.outputs.rust == 'true'
        run: |
          cargo install --locked cargo-deny
          cargo deny check

      - name: Dockerfile lint (hadolint)
        if: hashFiles('Dockerfile') != ''
        run: docker run --rm -i ghcr.io/hadolint/hadolint < Dockerfile
